<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Kakeibo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen pb-10">

    <!-- ヘッダー -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700/60 sticky top-0 z-20">
        <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="bg-indigo-500 text-white p-1.5 rounded-lg">
                    <i data-lucide="wallet" class="w-4 h-4"></i>
                </div>
                <h1 class="text-sm font-bold tracking-wide">My Kakeibo</h1>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-[10px] font-medium px-2 py-0.5 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full">
                    ログイン中
                </span>
                <button class="p-1.5 text-slate-400 hover:text-white hover:bg-slate-700/50 rounded-lg transition">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- タブ切り替え（動的追加対応） -->
        <div class="max-w-xl mx-auto px-4 flex items-center space-x-1 overflow-x-auto no-scrollbar border-t border-slate-700/40 py-2">
            <div id="tabs-container" class="flex space-x-1 flex-nowrap">
                <!-- JavaScriptでタブを動的生成 -->
            </div>
            <button onclick="openAddTabModal()" class="px-2.5 py-1 text-xs font-semibold rounded-md bg-slate-700 hover:bg-slate-600 text-indigo-300 transition whitespace-nowrap flex items-center space-x-1 shrink-0">
                <i data-lucide="plus" class="w-3 h-3"></i>
                <span>追加</span>
            </button>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-xl mx-auto px-4 mt-4 space-y-4">

        <!-- 1. 収支表示カード -->
        <div class="bg-gradient-to-br from-slate-800 to-slate-800/90 rounded-2xl p-4 border border-slate-700/60 shadow-lg">
            <div class="flex justify-between items-start">
                <div>
                    <span id="current-tab-label" class="text-[11px] font-medium text-indigo-400">総収支</span>
                    <div id="total-balance-display" class="text-2xl sm:text-3xl font-extrabold tracking-tight mt-0.5 text-white">
                        ¥0
                    </div>
                </div>
                <button onclick="alert('収支の追加フォームを開きます')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-1.5 rounded-xl shadow transition flex items-center space-x-1">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    <span>追加</span>
                </button>
            </div>
            
            <div class="grid grid-cols-2 gap-3 mt-4 pt-3 border-t border-slate-700/60 text-xs">
                <div class="flex items-center space-x-2">
                    <div class="bg-emerald-500/10 p-1.5 rounded-lg text-emerald-400">
                        <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
                    </div>
                    <div>
                        <p class="text-slate-400">今月収入</p>
                        <p id="monthly-income-display" class="font-bold text-slate-200">¥0</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <div class="bg-rose-500/10 p-1.5 rounded-lg text-rose-400">
                        <i data-lucide="arrow-down-right" class="w-4 h-4"></i>
                    </div>
                    <div>
                        <p class="text-slate-400">今月支出</p>
                        <p id="monthly-expense-display" class="font-bold text-slate-200">¥0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. カレンダーセクション -->
        <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700/60 shadow-sm">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center space-x-2">
                    <i data-lucide="calendar" class="w-4 h-4 text-indigo-400"></i>
                    <h2 id="calendar-title" class="text-sm font-bold text-white">2026年 10月</h2>
                </div>
                <div class="flex items-center space-x-1">
                    <button class="p-1 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-white transition">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                    </button>
                    <button class="p-1 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-white transition">
                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- 曜日 -->
            <div class="grid grid-cols-7 text-center text-[10px] font-semibold text-slate-400 mb-2">
                <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
            </div>
            
            <!-- カレンダー日付グリッド（今日を強調表示） -->
            <div id="calendar-grid" class="grid grid-cols-7 gap-1">
                <!-- JavaScriptでカレンダーを動的生成 -->
            </div>
        </div>

    </main>

    <!-- タブ追加モーダル（非表示状態） -->
    <div id="add-tab-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center z-50 px-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 max-w-sm w-full shadow-2xl space-y-4">
            <h3 class="text-sm font-bold text-white">新しいタブ（用途）を追加</h3>
            <input type="text" id="new-tab-name" placeholder="例: 副業、お小遣い、旅行など" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
            <div class="flex space-x-2 justify-end">
                <button onclick="closeAddTabModal()" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-700 hover:bg-slate-600 text-slate-300 transition">キャンセル</button>
                <button onclick="addNewTab()" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white transition">追加する</button>
            </div>
        </div>
    </div>

    <!-- アプリケーション制御スクリプト -->
    <script>
        // 初期データ（データはすべて空からスタート）
        let tabs = JSON.parse(localStorage.getItem('kakeibo_tabs')) || [
            { id: 'all', name: '総合' },
            { id: 'personal', name: 'プライベート' }
        ];
        let currentTabId = tabs[0].id;

        // タブを描画する関数
        function renderTabs() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';
            
            tabs.forEach(tab => {
                const isSelected = tab.id === currentTabId;
                const btn = document.createElement('button');
                btn.className = `px-3 py-1 text-xs font-semibold rounded-md transition whitespace-nowrap ${
                    isSelected 
                        ? 'bg-indigo-600 text-white' 
                        : 'text-slate-400 hover:text-white hover:bg-slate-700/50'
                }`;
                btn.innerText = tab.name;
                btn.onclick = () => switchTab(tab.id);
                container.appendChild(btn);
            });

            // 現在のタブ名をラベルに反映
            const activeTab = tabs.find(t => t.id === currentTabId);
            if (activeTab) {
                document.getElementById('current-tab-label').innerText = `${activeTab.name}の総収支`;
            }
            lucide.createIcons();
        }

        function switchTab(tabId) {
            currentTabId = tabId;
            renderTabs();
        }

        // タブ追加モーダル制御
        function openAddTabModal() {
            document.getElementById('add-tab-modal').classList.remove('hidden');
            document.getElementById('add-tab-modal').classList.add('flex');
        }

        function closeAddTabModal() {
            document.getElementById('add-tab-modal').classList.remove('flex');
            document.getElementById('add-tab-modal').classList.add('hidden');
            document.getElementById('new-tab-name').value = '';
        }

        function addNewTab() {
            const nameInput = document.getElementById('new-tab-name');
            const name = nameInput.value.trim();
            if (!name) return;

            const newId = 'tab_' + Date.now();
            tabs.push({ id: newId, name: name });
            localStorage.setItem('kakeibo_tabs', JSON.stringify(tabs));
            
            currentTabId = newId;
            closeAddTabModal();
            renderTabs();
        }

        // カレンダー生成（今日の日付：2026年10月19日を反映）
        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            // 2026年10月の仮定（今日の日付を19日としてハイライト）
            const todayDate = 19; 

            for (let i = 1; i <= 31; i++) {
                const isToday = (i === todayDate);
                const cell = document.createElement('div');
                
                cell.className = `aspect-[1/1.1] p-1 flex flex-col justify-between items-center rounded-xl border transition cursor-pointer ${
                    isToday 
                        ? 'bg-indigo-500/20 border-indigo-500 shadow-sm shadow-indigo-500/20' 
                        : 'bg-slate-700/30 border-slate-700/50 hover:border-indigo-500/50 hover:bg-indigo-500/10'
                }`;

                cell.innerHTML = `
                    <div class="w-full flex justify-between items-center px-0.5">
                        <span class="text-xs font-medium ${isToday ? 'text-indigo-300 font-bold' : 'text-slate-300'}">${i}</span>
                        ${isToday ? '<span class="text-[8px] bg-indigo-600 text-white px-1 rounded-full font-bold">今日</span>' : ''}
                    </div>
                    <div class="w-full flex flex-col items-center gap-0.5 pb-0.5">
                        <!-- データなしの状態 -->
                    </div>
                `;

                cell.onclick = () => alert(`2026年10月${i}日の明細・詳細`);
                grid.appendChild(cell);
            }
        }

        // 初期化実行
        renderTabs();
        renderCalendar();
        lucide.createIcons();
    </script>
</body>
</html>
