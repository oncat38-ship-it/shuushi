<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Kakeibo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-12">

    <!-- ヘッダー -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="bg-indigo-600 text-white p-2 rounded-xl">
                    <i data-lucide="wallet" class="w-5 h-5"></i>
                </div>
                <h1 class="text-lg font-bold text-slate-900">My Kakeibo</h1>
            </div>
            <div class="flex items-center space-x-3">
                <span class="text-xs font-medium px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-full">
                    ログイン中
                </span>
                <button class="p-2 text-slate-600 hover:bg-slate-100 rounded-full transition">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">

        <!-- 1. 総収支カード -->
        <div class="bg-gradient-to-br from-indigo-900 to-indigo-700 rounded-2xl p-6 text-white shadow-lg">
            <p class="text-indigo-200 text-sm font-medium">現在の総収支総計</p>
            <div class="text-3xl sm:text-4xl font-extrabold mt-1 tracking-tight">
                ¥245,800
            </div>
            
            <div class="grid grid-cols-2 gap-4 mt-6 pt-4 border-t border-indigo-600/50">
                <div class="flex items-center space-x-3">
                    <div class="bg-emerald-500/20 p-2 rounded-lg text-emerald-300">
                        <i data-lucide="arrow-up-right" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <p class="text-xs text-indigo-200">今月収入</p>
                        <p class="text-base sm:text-lg font-bold">¥320,000</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <div class="bg-rose-500/20 p-2 rounded-lg text-rose-300">
                        <i data-lucide="arrow-down-right" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <p class="text-xs text-indigo-200">今月支出</p>
                        <p class="text-base sm:text-lg font-bold">¥74,200</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. タグフィルター（横スクロールで1画面に収める） -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center space-x-2 text-slate-700 font-semibold text-sm">
                    <i data-lucide="tag" class="w-4 h-4 text-indigo-600"></i>
                    <span>タグで絞り込み</span>
                </div>
                <button class="text-xs text-indigo-600 font-medium hover:underline flex items-center">
                    <i data-lucide="plus" class="w-3.5 h-3.5 mr-0.5"></i> タグ追加
                </button>
            </div>
            
            <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
                <button class="px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap bg-indigo-600 text-white shadow-sm transition-all">
                    すべて
                </button>
                <button class="px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap bg-amber-100 text-amber-800 border border-amber-300 transition-all">
                    食費
                </button>
                <button class="px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap bg-blue-100 text-blue-800 border border-blue-300 transition-all">
                    固定費
                </button>
                <button class="px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap bg-purple-100 text-purple-800 border border-purple-300 transition-all">
                    娯楽
                </button>
                <button class="px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap bg-emerald-100 text-emerald-800 border border-emerald-300 transition-all">
                    給与
                </button>
                <button class="px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap bg-slate-100 text-slate-700 border border-slate-300 transition-all">
                    その他
                </button>
            </div>
        </div>

        <!-- 3. 日ごとの増減グラフセクション -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h2 class="font-bold text-slate-900">日ごとの推移傾向</h2>
                    <p class="text-xs text-slate-500">直近の収支バランスの偏りを確認できます</p>
                </div>
                <button class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg transition font-medium">
                    詳細を見る
                </button>
            </div>
            
            <!-- グラフ領域（簡易プレビューバー） -->
            <div class="h-40 flex items-end justify-between gap-2 pt-6 px-2 border-b border-slate-100 pb-2">
                <div class="w-full bg-indigo-100 rounded-t h-1/2 flex flex-col justify-between items-center text-[10px] text-indigo-800 font-bold py-1"><span>+5k</span><span class="text-slate-400 font-normal">1日</span></div>
                <div class="w-full bg-rose-100 rounded-t h-1/4 flex flex-col justify-between items-center text-[10px] text-rose-800 font-bold py-1"><span>-2k</span><span class="text-slate-400 font-normal">5日</span></div>
                <div class="w-full bg-indigo-500 rounded-t h-3/4 flex flex-col justify-between items-center text-[10px] text-white font-bold py-1"><span>+12k</span><span class="text-indigo-200 font-normal">10日</span></div>
                <div class="w-full bg-rose-100 rounded-t h-1/3 flex flex-col justify-between items-center text-[10px] text-rose-800 font-bold py-1"><span>-4k</span><span class="text-slate-400 font-normal">15日</span></div>
                <div class="w-full bg-indigo-300 rounded-t h-2/3 flex flex-col justify-between items-center text-[10px] text-indigo-900 font-bold py-1"><span>+8k</span><span class="text-slate-400 font-normal">20日</span></div>
                <div class="w-full bg-indigo-600 rounded-t h-full flex flex-col justify-between items-center text-[10px] text-white font-bold py-1"><span>+15k</span><span class="text-indigo-200 font-normal">25日</span></div>
                <div class="w-full bg-indigo-200 rounded-t h-1/3 flex flex-col justify-between items-center text-[10px] text-indigo-900 font-bold py-1"><span>+3k</span><span class="text-slate-400 font-normal">30日</span></div>
            </div>
        </div>

        <!-- 4. カレンダー＆日別収支確認セクション -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center space-x-2">
                    <i data-lucide="calendar" class="w-5 h-5 text-indigo-600"></i>
                    <h2 class="font-bold text-slate-900">2026年 10月</h2>
                </div>
                <div class="flex items-center space-x-1">
                    <button class="p-1.5 hover:bg-slate-100 rounded-lg text-slate-600 transition">
                        <i data-lucide="chevron-left" class="w-5 h-5"></i>
                    </button>
                    <button class="p-1.5 hover:bg-slate-100 rounded-lg text-slate-600 transition">
                        <i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- カレンダー曜日 -->
            <div class="grid grid-cols-7 text-center text-xs font-semibold text-slate-400 mb-2">
                <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
            </div>
            
            <!-- カレンダー日付グリッド -->
            <div class="grid grid-cols-7 gap-1 text-sm">
                <script>
                    // 簡易的に31日分のカレンダーマスをループ生成
                    for (let i = 1; i <= 31; i++) {
                        let badgeHtml = '';
                        if (i % 3 === 0) badgeHtml += '<span class="text-[9px] bg-rose-100 text-rose-700 px-1 rounded w-full text-center truncate">-¥1.2万</span>';
                        if (i === 25) badgeHtml += '<span class="text-[9px] bg-emerald-100 text-emerald-700 px-1 rounded w-full text-center truncate">+¥32万</span>';
                        
                        document.write(`
                            <div class="aspect-square p-1 flex flex-col justify-between items-center rounded-xl border border-slate-100 hover:border-indigo-300 hover:bg-indigo-50/30 cursor-pointer transition">
                                <span class="text-xs text-slate-700 font-medium">${i}</span>
                                <div class="w-full flex flex-col items-center gap-0.5 pb-1">
                                    ${badgeHtml}
                                </div>
                            </div>
                        `);
                    }
                </script>
            </div>
        </div>

    </main>

    <!-- アイコン有効化スクリプト -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
