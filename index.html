<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Kakeibo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .theme-cute { font-family: 'M PLUS Rounded 1c', sans-serif; }
        .theme-simple { font-family: 'Noto Sans JP', sans-serif; }
        .theme-classic { font-family: 'Noto Sans JP', serif; }

        @keyframes pulse-attention {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .anniversary-badge-animation {
            animation: pulse-attention 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body id="app-body" class="antialiased min-h-screen pb-12 transition-colors duration-300">

    <!-- ヘッダー -->
    <header id="app-header" class="backdrop-blur border-b sticky top-0 z-20 shadow-sm transition-colors duration-300">
        <div class="max-w-xl mx-auto px-4 py-2.5 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div id="header-icon-bg" class="p-1.5 rounded-xl shadow-md transition-colors duration-300">
                    <i id="header-icon" data-lucide="wallet" class="w-4 h-4 text-white"></i>
                </div>
                <h1 id="header-title" class="text-sm font-extrabold tracking-wide flex items-center gap-1">
                    My Kakeibo
                </h1>
            </div>
            <div class="flex items-center space-x-2">
                <span id="save-badge" class="text-[10px] font-bold px-2 py-0.5 border rounded-full flex items-center gap-1">
                    <i data-lucide="sparkles" class="w-3 h-3"></i> 保存中
                </span>
                <button onclick="openSettingsModal()" id="settings-btn" class="p-1.5 rounded-xl transition" title="設定">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- タブ切り替えバー -->
        <div id="tabs-bar" class="max-w-xl mx-auto px-3 border-t py-1.5">
            <div id="tabs-container" class="flex items-center justify-center flex-wrap gap-1"></div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-xl mx-auto px-4 mt-3 space-y-3">

        <!-- 1. 収支表示カード -->
        <div id="summary-card" class="rounded-2xl p-4 text-white shadow-lg relative overflow-hidden transition-all duration-300">
            <div class="flex justify-between items-center relative z-10">
                <div>
                    <span id="current-tab-label" class="text-[10px] font-bold bg-white/20 backdrop-blur px-2 py-0.5 rounded-full text-white inline-flex items-center gap-1">
                        総合の総収支
                    </span>
                    <div id="total-balance" class="text-2xl sm:text-3xl font-black tracking-tight mt-1 text-white drop-shadow-sm">
                        ¥0
                    </div>
                </div>
                <button onclick="openAddModal()" id="add-tx-btn" class="text-xs font-extrabold px-3 py-1.5 rounded-xl shadow hover:shadow-md transition flex items-center space-x-1 shrink-0">
                    <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
                    <span>入力する</span>
                </button>
            </div>
            
            <div class="grid grid-cols-2 gap-2 mt-3 pt-2 border-t border-white/25 text-xs relative z-10">
                <div class="flex items-center space-x-2 bg-white/15 backdrop-blur p-2 rounded-xl">
                    <div id="income-icon-bg" class="bg-white p-1 rounded-lg shadow-sm">
                        <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i>
                    </div>
                    <div>
                        <p class="opacity-80 text-[9px] font-bold">今月の収入</p>
                        <p id="monthly-income" class="font-black text-xs sm:text-sm text-white">¥0</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2 bg-white/15 backdrop-blur p-2 rounded-xl">
                    <div id="expense-icon-bg" class="bg-white p-1 rounded-lg shadow-sm">
                        <i data-lucide="arrow-down-right" class="w-3.5 h-3.5"></i>
                    </div>
                    <div>
                        <p class="opacity-80 text-[9px] font-bold">今月の支出</p>
                        <p id="monthly-expense" class="font-black text-xs sm:text-sm text-white">¥0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. カレンダーセクション -->
        <div id="calendar-card" class="rounded-3xl p-3 sm:p-4 border shadow-sm transition-all duration-300">
            <div class="flex items-center justify-between mb-2 px-1">
                <div class="flex items-center space-x-2">
                    <div id="calendar-icon-bg" class="p-1.5 rounded-xl">
                        <i data-lucide="calendar" class="w-4 h-4"></i>
                    </div>
                    <h2 id="calendar-title" class="text-sm font-extrabold"></h2>
                </div>
                <div class="flex items-center space-x-1">
                    <button onclick="changeMonth(-1)" class="p-1.5 rounded-xl border border-transparent hover:border-slate-200 transition">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                    </button>
                    <button onclick="changeMonth(1)" class="p-1.5 rounded-xl border border-transparent hover:border-slate-200 transition">
                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <div id="calendar-weekdays" class="grid grid-cols-7 text-center text-[10px] font-extrabold mb-1">
                <span class="text-rose-500">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="text-sky-500">土</span>
            </div>
            
            <div id="calendar-grid" class="grid grid-cols-7 gap-0.5"></div>
        </div>

    </main>

    <!-- Modal 1: 収支・予定日入力モーダル -->
    <div id="add-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div id="add-modal-content" class="rounded-3xl p-5 max-w-sm w-full shadow-2xl space-y-3 border max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center">
                <h3 id="add-modal-title" class="text-sm font-extrabold">登録する</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:opacity-70"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <div class="bg-slate-100 p-2 rounded-2xl flex items-center justify-between text-xs font-bold text-slate-700">
                <div class="flex items-center space-x-1.5">
                    <i data-lucide="calendar" class="w-4 h-4 text-slate-400"></i>
                    <span>記帳日:</span>
                </div>
                <input type="date" id="tx-date" class="bg-transparent border-0 font-extrabold focus:outline-none cursor-pointer text-right">
            </div>

            <div class="space-y-2.5 text-xs">
                <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-100 rounded-2xl font-bold">
                    <button type="button" id="mode-tx-btn" onclick="setEntryMode('tx')" class="py-1.5 rounded-xl transition">収支を記帳 💸</button>
                    <button type="button" id="mode-plan-btn" onclick="setEntryMode('plan')" class="py-1.5 rounded-xl transition">予定日を設定 📅</button>
                </div>

                <div id="form-tx-section" class="space-y-2.5">
                    <div>
                        <label class="text-slate-400 font-bold block mb-1">区分</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" id="type-expense-btn" onclick="setTxType('expense')" class="py-2 rounded-2xl font-bold transition">支出 💸</button>
                            <button type="button" id="type-income-btn" onclick="setTxType('income')" class="py-2 rounded-2xl font-bold transition">収入 💰</button>
                        </div>
                    </div>

                    <div>
                        <label class="text-slate-400 font-bold block mb-1">ジャンル（タグ）</label>
                        <div id="tag-select-container" class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto p-1.5 rounded-2xl border"></div>
                    </div>

                    <div>
                        <label class="text-slate-400 font-bold block mb-1">金額 (円)</label>
                        <input type="number" id="tx-amount" placeholder="例: 1500" class="w-full border rounded-2xl px-3 py-2 font-bold focus:outline-none">
                    </div>
                </div>

                <div id="form-plan-section" class="space-y-2.5 hidden">
                    <div>
                        <label class="text-slate-400 font-bold block mb-1">予定の内容</label>
                        <input type="text" id="plan-title" placeholder="例: 旅行、美容院など" class="w-full border rounded-2xl px-3 py-2 font-bold focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="text-slate-400 font-bold block mb-1">詳細・メモ（任意）</label>
                    <input type="text" id="tx-memo" placeholder="例: メモ書きなど" class="w-full border rounded-2xl px-3.5 py-2 focus:outline-none">
                </div>
            </div>

            <button onclick="saveEntry()" id="save-tx-btn" class="w-full py-2.5 text-white font-extrabold rounded-2xl text-xs transition shadow-md">保存する</button>
        </div>
    </div>

    <!-- Modal 2: 日別明細モーダル -->
    <div id="day-detail-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div id="day-detail-modal-content" class="rounded-3xl p-5 max-w-sm w-full shadow-2xl space-y-4 border max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center">
                <h3 id="day-detail-title" class="text-sm font-extrabold">日付の明細</h3>
                <button onclick="closeDayDetailModal()" class="text-slate-400 hover:opacity-70"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <div id="day-detail-list" class="space-y-2 max-h-60 overflow-y-auto text-xs"></div>

            <button onclick="openAddModalFromDetail()" id="detail-add-btn" class="w-full py-2.5 font-bold rounded-2xl text-xs transition">
                + この日に追加する
            </button>
        </div>
    </div>

    <!-- Modal 3: タブ追加モーダル -->
    <div id="add-tab-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div id="add-tab-modal-content" class="rounded-3xl p-5 max-w-sm w-full shadow-2xl space-y-4 border">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-extrabold">新しいタブを追加</h3>
                <button onclick="closeAddTabModal()" class="text-slate-400 hover:opacity-70"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <input type="text" id="new-tab-name" placeholder="例: プライベート、副業など" class="w-full border rounded-2xl px-3.5 py-2 text-xs focus:outline-none">
            <button onclick="addNewTab()" id="save-tab-btn" class="w-full py-2.5 text-white font-bold rounded-2xl text-xs transition">追加する</button>
        </div>
    </div>

    <!-- Modal 4: 設定モーダル -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div id="settings-modal-content" class="rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4 border max-h-[85vh] flex flex-col">
            
            <div class="flex justify-between items-center border-b pb-3 shrink-0">
                <div class="flex items-center space-x-2">
                    <button id="settings-back-btn" onclick="showSettingsMenu()" class="hidden p-1 text-slate-400 hover:text-slate-700 transition">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    </button>
                    <h3 id="settings-header-title" class="text-sm font-extrabold">設定 ⚙️</h3>
                </div>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:opacity-70"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <!-- ページ1: 設定メニュー一覧 -->
            <div id="settings-page-menu" class="space-y-2.5 text-xs overflow-y-auto flex-1 pr-1">
                <button onclick="showSettingsDetail('theme')" class="w-full p-3.5 bg-slate-50/80 hover:bg-slate-100 rounded-2xl border flex items-center justify-between font-bold text-slate-700 transition">
                    <div class="flex items-center space-x-3">
                        <div class="p-2 bg-indigo-100 text-indigo-600 rounded-xl"><i data-lucide="palette" class="w-4 h-4"></i></div>
                        <span>デザインテーマ設定</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
                </button>

                <button onclick="showSettingsDetail('tabs')" class="w-full p-3.5 bg-slate-50/80 hover:bg-slate-100 rounded-2xl border flex items-center justify-between font-bold text-slate-700 transition">
                    <div class="flex items-center space-x-3">
                        <div class="p-2 bg-emerald-100 text-emerald-600 rounded-xl"><i data-lucide="folder" class="w-4 h-4"></i></div>
                        <span>タブの編集・削除</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
                </button>

                <button onclick="showSettingsDetail('anniversaries')" class="w-full p-3.5 bg-slate-50/80 hover:bg-slate-100 rounded-2xl border flex items-center justify-between font-bold text-slate-700 transition">
                    <div class="flex items-center space-x-3">
                        <div class="p-2 bg-pink-100 text-pink-600 rounded-xl"><i data-lucide="heart" class="w-4 h-4"></i></div>
                        <span>記念日の設定</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
                </button>

                <button onclick="showSettingsDetail('salary')" class="w-full p-3.5 bg-slate-50/80 hover:bg-slate-100 rounded-2xl border flex items-center justify-between font-bold text-slate-700 transition">
                    <div class="flex items-center space-x-3">
                        <div class="p-2 bg-amber-100 text-amber-600 rounded-xl"><i data-lucide="coins" class="w-4 h-4"></i></div>
                        <span>給料日の設定</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
                </button>

                <button onclick="showSettingsDetail('tags')" class="w-full p-3.5 bg-slate-50/80 hover:bg-slate-100 rounded-2xl border flex items-center justify-between font-bold text-slate-700 transition">
                    <div class="flex items-center space-x-3">
                        <div class="p-2 bg-rose-100 text-rose-600 rounded-xl"><i data-lucide="tags" class="w-4 h-4"></i></div>
                        <span>タグの追加・編集（支出/収入別）</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
                </button>
            </div>

            <!-- ページ2-A: テーマ設定 -->
            <div id="settings-page-theme" class="space-y-4 text-xs overflow-y-auto flex-1 pr-1 hidden">
                <div class="space-y-3">
                    <p class="text-slate-400 font-bold">お好みのデザインテーマを選択してください：</p>
                    <div class="grid grid-cols-1 gap-2.5">
                        <button onclick="setTheme('cute')" id="theme-cute-btn" class="p-3.5 rounded-2xl font-bold border text-left transition flex items-center justify-between">
                            <span>🌸 かわいい系 (パステル＆肉球)</span>
                            <span class="text-xs">🐾</span>
                        </button>
                        <button onclick="setTheme('simple')" id="theme-simple-btn" class="p-3.5 rounded-2xl font-bold border text-left transition flex items-center justify-between">
                            <span>⚪ シンプル (すっきりホワイト)</span>
                            <span class="text-xs">✨</span>
                        </button>
                        <button onclick="setTheme('classic')" id="theme-classic-btn" class="p-3.5 rounded-2xl font-bold border text-left transition flex items-center justify-between">
                            <span>📜 クラシック (温かみのある木目調)</span>
                            <span class="text-xs">🪵</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- ページ2-B: タブ管理設定 -->
            <div id="settings-page-tabs" class="space-y-4 text-xs overflow-y-auto flex-1 pr-1 hidden">
                <div class="space-y-3">
                    <div>
                        <label class="text-slate-400 font-bold block mb-1">新しいタブを追加</label>
                        <div class="flex space-x-2">
                            <input type="text" id="settings-new-tab-name" placeholder="例: 仕事、旅行など" class="flex-1 border rounded-xl px-3 py-2 focus:outline-none">
                            <button onclick="addNewTabFromSettings()" id="add-tab-setting-btn" class="px-4 py-2 text-white font-bold rounded-xl transition whitespace-nowrap">追加</button>
                        </div>
                    </div>

                    <div>
                        <label class="text-slate-400 font-bold block mb-1">登録済みタブ一覧（総合は削除不可）</label>
                        <div id="settings-tab-list" class="space-y-1.5 max-h-52 overflow-y-auto p-1 border rounded-2xl"></div>
                    </div>
                </div>
            </div>

            <!-- ページ2-C: 記念日設定 (種類選択付き) -->
            <div id="settings-page-anniversaries" class="space-y-4 text-xs overflow-y-auto flex-1 pr-1 hidden">
                <div class="space-y-3">
                    <div>
                        <label class="text-slate-400 font-bold block mb-1">記念日の種類</label>
                        <select id="new-anni-category" class="w-full border rounded-xl px-3 py-2 font-bold focus:outline-none mb-2">
                            <option value="love">💛 大切な人との記念日（恋人・家族）</option>
                            <option value="money">💰 金銭的に大切な記念日（契約日・建立日）</option>
                            <option value="other">📌 その他いろんな重要ごと</option>
                        </select>

                        <label class="text-slate-400 font-bold block mb-1">記念日の内容</label>
                        <input type="text" id="new-anni-title" placeholder="例: 結婚記念日、契約日など" class="w-full border rounded-xl px-3 py-2 focus:outline-none mb-2">
                        
                        <label class="text-slate-400 font-bold block mb-1">日付</label>
                        <div class="flex space-x-2">
                            <input type="date" id="new-anni-date" class="flex-1 border rounded-xl px-3 py-2 focus:outline-none font-bold">
                            <button onclick="addNewAnniversary()" id="add-anni-btn" class="px-4 py-2 text-white font-bold rounded-xl transition whitespace-nowrap">追加</button>
                        </div>
                    </div>

                    <div>
                        <label class="text-slate-400 font-bold block mb-1">登録済み記念日一覧（毎年自動表示）</label>
                        <div id="settings-anni-list" class="space-y-1.5 max-h-40 overflow-y-auto p-1 border rounded-2xl"></div>
                    </div>
                </div>
            </div>

            <!-- ページ2-D: 給料日設定 -->
            <div id="settings-page-salary" class="space-y-4 text-xs overflow-y-auto flex-1 pr-1 hidden">
                <div class="space-y-3">
                    <div>
                        <label class="text-slate-400 font-bold block mb-1">給料日の指定</label>
                        <select id="salary-day-select" class="w-full border rounded-xl px-3 py-2 font-bold focus:outline-none">
                            <option value="0">未設定</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-slate-400 font-bold block mb-1">土日祝日の場合</label>
                        <select id="salary-holiday-rule" class="w-full border rounded-xl px-3 py-2 font-bold focus:outline-none">
                            <option value="prev">前日（前営業日）にずらす</option>
                            <option value="next">翌日（翌営業日）にずらす</option>
                            <option value="none">そのまま（変更なし）</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-slate-400 font-bold block mb-1">金額設定 (任意)</label>
                        <input type="number" id="salary-amount" placeholder="未入力の場合は当日手入力" class="w-full border rounded-xl px-3 py-2 font-bold focus:outline-none">
                    </div>

                    <button onclick="saveSalarySettings()" id="save-salary-btn" class="w-full py-2.5 text-white font-bold rounded-xl transition">保存する</button>
                </div>
            </div>

            <!-- ページ2-E: タグ設定（支出・収入別） -->
            <div id="settings-page-tags" class="space-y-4 text-xs overflow-y-auto flex-1 pr-1 hidden">
                <div class="space-y-3">
                    <div class="grid grid-cols-2 gap-1 p-1 bg-slate-100 rounded-xl font-bold text-center">
                        <button type="button" onclick="setSettingTagType('expense')" id="stype-exp-btn" class="py-1 rounded-lg transition">支出タグ</button>
                        <button type="button" onclick="setSettingTagType('income')" id="stype-inc-btn" class="py-1 rounded-lg transition">収入タグ</button>
                    </div>

                    <div>
                        <div class="flex space-x-2">
                            <input type="text" id="new-tag-name" placeholder="例: 食費、給与など" class="flex-1 border rounded-xl px-3 py-2 focus:outline-none">
                            <button onclick="addNewTag()" id="add-tag-btn" class="px-4 py-2 text-white font-bold rounded-xl transition whitespace-nowrap">追加</button>
                        </div>
                    </div>

                    <div>
                        <div id="settings-tag-list" class="space-y-1.5 max-h-44 overflow-y-auto p-1 border rounded-2xl"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- アプリケーション制御スクリプト -->
    <script>
        let currentTheme = localStorage.getItem('kakeibo_theme') || 'cute';
        let tabs = JSON.parse(localStorage.getItem('kakeibo_tabs')) || [
            { id: 'all', name: '総合' },
            { id: 'personal', name: 'プライベート' }
        ];
        let currentTabId = tabs[0].id;
        
        let tags = JSON.parse(localStorage.getItem('kakeibo_tags')) || {
            expense: [
                { id: 't_exp_1', name: '食費' },
                { id: 't_exp_2', name: '日用品' },
                { id: 't_exp_3', name: '交通費' }
            ],
            income: [
                { id: 't_inc_1', name: '給与' },
                { id: 't_inc_2', name: '副業' }
            ]
        };
        if (Array.isArray(tags)) {
            tags = { expense: tags, income: [{ id: 't_inc_1', name: '給与' }] };
        }

        let anniversaries = JSON.parse(localStorage.getItem('kakeibo_anniversaries')) || [];

        let selectedTagId = '';
        let settingTagType = 'expense';

            document.getElementById('settings-page-menu').classList.remove('hidden');

        }

        function showSettingsDetail(page) {
            document.getElementById('settings-back-btn').classList.remove('hidden');
            document.getElementById('settings-page-menu').classList.add('hidden');
            document.getElementById('settings-page-theme').classList.add('hidden');
            document.getElementById('settings-page-tabs').classList.add('hidden');
            document.getElementById('settings-page-anniversaries').classList.add('hidden');
            document.getElementById('settings-page-salary').classList.add('hidden');
            document.getElementById('settings-page-tags').classList.add('hidden');

            if (page === 'theme') {
                document.getElementById('settings-header-title').innerText = 'テーマ設定 🎨';
                document.getElementById('settings-page-theme').classList.remove('hidden');
            } else if (page === 'tabs') {
                document.getElementById('settings-header-title').innerText = 'タブの編集・削除 📁';
                document.getElementById('settings-page-tabs').classList.remove('hidden');
                renderSettingsTabList();
            } else if (page === 'anniversaries') {
                document.getElementById('settings-header-title').innerText = '記念日の設定 ♥';
                document.getElementById('settings-page-anniversaries').classList.remove('hidden');
                renderSettingsAnniversaryList();
            } else if (page === 'salary') {
                document.getElementById('settings-header-title').innerText = '給料日設定 💰';
                document.getElementById('settings-page-salary').classList.remove('hidden');
            } else if (page === 'tags') {
                document.getElementById('settings-header-title').innerText = 'タグの編集・追加 🏷️';
                document.getElementById('settings-page-tags').classList.remove('hidden');
                setSettingTagType('expense');
            }
            lucide.createIcons();
        }

        // --- 記念日管理機能 ---
        function renderSettingsAnniversaryList() {
            const container = document.getElementById('settings-anni-list');
            if (!container) return;
            container.innerHTML = '';
            if (anniversaries.length === 0) {
                container.innerHTML = '<p class="text-slate-400 text-center py-2">登録されている記念日はありません</p>';
                return;
            }

            anniversaries.forEach((anni) => {
                const categoryNames = { love: '💛 大切な人', money: '💰 金銭的', other: '📌 その他' };
                const catLabel = categoryNames[anni.category] || '📌 その他';
                const item = document.createElement('div');
                item.className = "flex justify-between items-center bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm";
                item.innerHTML = `
                    <div>
                        <div class="flex items-center space-x-1.5">
                            <span class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-bold">${catLabel}</span>
                            <p class="font-bold text-slate-700">${anni.title}</p>
                        </div>
                        <p class="text-[10px] text-slate-400 mt-0.5">${anni.date}</p>
                    </div>
                    <button onclick="deleteAnniversary('${anni.id}')" class="p-1 text-slate-400 hover:text-rose-500 transition">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                `;
                container.appendChild(item);
            });
            lucide.createIcons();
        }

        function addNewAnniversary() {
            const catSelect = document.getElementById('new-anni-category');
            const titleInput = document.getElementById('new-anni-title');
            const dateInput = document.getElementById('new-anni-date');
            
            const category = catSelect ? catSelect.value : 'love';
            const title = titleInput ? titleInput.value.trim() : '';
            const date = dateInput ? dateInput.value : '';

            if (!title || !date) {
                alert('記念日のタイトルと日付を入力してください。');
                return;
            }
            anniversaries.push({ id: 'anni_' + Date.now(), category, title, date });
            localStorage.setItem('kakeibo_anniversaries', JSON.stringify(anniversaries));
            if (titleInput) titleInput.value = '';
            if (dateInput) dateInput.value = '';
            renderSettingsAnniversaryList();
            renderCalendar();
        }

        function deleteAnniversary(id) {
            if (!confirm('この記念日を削除しますか？')) return;
            anniversaries = anniversaries.filter(a => a.id !== id);
            localStorage.setItem('kakeibo_anniversaries', JSON.stringify(anniversaries));
            renderSettingsAnniversaryList();
            renderCalendar();
        }

        function setSettingTagType(type) {
            settingTagType = type;
            const expBtn = document.getElementById('stype-exp-btn');
            const incBtn = document.getElementById('stype-inc-btn');
            if (expBtn && incBtn) {
                if (type === 'expense') {
                    expBtn.className = "py-1 rounded-lg transition bg-slate-800 text-white shadow-sm font-bold";
                    incBtn.className = "py-1 rounded-lg transition text-slate-500 hover:text-slate-800 font-bold";
                } else {
                    expBtn.className = "py-1 rounded-lg transition text-slate-500 hover:text-slate-800 font-bold";
                    incBtn.className = "py-1 rounded-lg transition bg-slate-800 text-white shadow-sm font-bold";
                }
            }
            renderSettingsTagList();
        }

        function renderSettingsTagList() {
            const container = document.getElementById('settings-tag-list');
            if (!container) return;
            container.innerHTML = '';
            const list = tags[settingTagType] || [];

            if (list.length === 0) {
                container.innerHTML = '<p class="text-slate-400 text-center py-2">タグがありません</p>';
                return;
            }

            list.forEach((tag, index) => {
                const item = document.createElement('div');
                item.className = "flex justify-between items-center bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm";
                item.innerHTML = `
                    <span class="font-bold text-slate-700">${tag.name}</span>
                    <div class="flex items-center space-x-1">
                        <button onclick="moveTag('${settingTagType}', ${index}, -1)" class="p-1 text-slate-400 hover:text-slate-700 ${index === 0 ? 'opacity-30 cursor-not-allowed' : ''}">
                            <i data-lucide="arrow-up" class="w-3.5 h-3.5"></i>
                        </button>
                        <button onclick="moveTag('${settingTagType}', ${index}, 1)" class="p-1 text-slate-400 hover:text-slate-700 ${index === list.length - 1 ? 'opacity-30 cursor-not-allowed' : ''}">
                            <i data-lucide="arrow-down" class="w-3.5 h-3.5"></i>
                        </button>
                        <button onclick="deleteTag('${settingTagType}', '${tag.id}')" class="p-1 text-slate-400 hover:text-rose-500 ml-1">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;
                container.appendChild(item);
            });
            lucide.createIcons();
        }

        function addNewTag() {
            const input = document.getElementById('new-tag-name');
            const name = input.value.trim();
            if (!name) return;
            if (!tags[settingTagType]) tags[settingTagType] = [];
            tags[settingTagType].push({ id: 'tag_' + Date.now(), name: name });
            localStorage.setItem('kakeibo_tags', JSON.stringify(tags));
            input.value = '';
            renderSettingsTagList();
        }

        function moveTag(type, index, direction) {
            const list = tags[type];
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= list.length) return;
            const temp = list[index];
            list[index] = list[newIndex];
            list[newIndex] = temp;
            localStorage.setItem('kakeibo_tags', JSON.stringify(tags));
            renderSettingsTagList();
        }

        function deleteTag(type, id) {
            if (!confirm('このタグを削除しますか？')) return;
            tags[type] = tags[type].filter(t => t.id !== id);
            localStorage.setItem('kakeibo_tags', JSON.stringify(tags));
            renderSettingsTagList();
        }

        // --- タブ機能 ---
        function renderTabs() {
            const container = document.getElementById('tabs-container');
            if (!container) return;
            container.innerHTML = '';
            
            let sizeClass = "px-3 py-1 text-xs font-bold rounded-xl transition whitespace-nowrap";
            if (tabs.length >= 5) {
                sizeClass = "px-2 py-0.5 text-[10px] font-bold rounded-lg transition whitespace-nowrap";
            } else if (tabs.length >= 4) {
                sizeClass = "px-2.5 py-1 text-[11px] font-bold rounded-xl transition whitespace-nowrap";
            }

            tabs.forEach(tab => {
                const isSelected = tab.id === currentTabId;
                const btn = document.createElement('button');
                
                if (currentTheme === 'cute') {
                    btn.className = `${sizeClass} ${
                        isSelected ? 'bg-rose-400 text-white shadow-sm shadow-pink-200' : 'bg-white/80 text-rose-400 hover:bg-pink-100 border border-pink-200/60'
                    }`;
                } else if (currentTheme === 'simple') {
                    btn.className = `${sizeClass} ${
                        isSelected ? 'bg-slate-900 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200'
                    }`;
                } else {
                    btn.className = `${sizeClass} ${
                        isSelected ? 'bg-[#6b4e3d] text-amber-50 shadow-sm' : 'bg-[#e8dccb] text-[#5c4433] hover:bg-[#dfcfba] border border-[#c8b8a4]'
                    }`;
                }

                btn.innerText = tab.name;
                btn.onclick = () => {
                    currentTabId = tab.id;
                    renderTabs();
                    renderSummary();
                    renderCalendar();
                };
                container.appendChild(btn);
            });

            const addBtn = document.createElement('button');
            addBtn.className = `${sizeClass} border transition flex items-center space-x-0.5 opacity-80 hover:opacity-100`;
            addBtn.innerHTML = '<i data-lucide="plus" class="w-3 h-3"></i><span>追加</span>';
            addBtn.onclick = openAddTabModal;
            container.appendChild(addBtn);

            const activeTab = tabs.find(t => t.id === currentTabId);
            if (activeTab) {
                const labelEl = document.getElementById('current-tab-label');
                if (labelEl) labelEl.innerText = `${activeTab.name}の収支`;
            }
            lucide.createIcons();
        }

        function renderSettingsTabList() {
            const container = document.getElementById('settings-tab-list');
            if (!container) return;
            container.innerHTML = '';

            tabs.forEach((tab, index) => {
                const isAll = tab.id === 'all';
                const item = document.createElement('div');
                item.className = "flex justify-between items-center bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm";
                item.innerHTML = `
                    <span class="font-bold text-slate-700">${tab.name} ${isAll ? '<span class="text-[10px] text-slate-400 font-normal">(デフォルト)</span>' : ''}</span>
                    <div class="flex items-center space-x-1">
                        ${!isAll ? `
                            <button onclick="deleteTab('${tab.id}')" class="p-1 text-slate-400 hover:text-rose-500 transition">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                        ` : '<span class="text-[10px] text-slate-400">削除不可</span>'}
                    </div>
                `;
                container.appendChild(item);
            });
            lucide.createIcons();
        }

        function addNewTabFromSettings() {
            const input = document.getElementById('settings-new-tab-name');
            const name = input.value.trim();
            if (!name) return;
            const newId = 'tab_' + Date.now();
            tabs.push({ id: newId, name: name });
            localStorage.setItem('kakeibo_tabs', JSON.stringify(tabs));
            input.value = '';
            renderSettingsTabList();
            renderTabs();
        }

        function deleteTab(id) {
            if (id === 'all') {
                alert('「総合」タブは削除できません。');
                return;
            }
            if (!confirm('このタブを削除しますか？')) return;
            tabs = tabs.filter(t => t.id !== id);
            localStorage.setItem('kakeibo_tabs', JSON.stringify(tabs));
            if (currentTabId === id) currentTabId = 'all';
            renderSettingsTabList();
            renderTabs();
            renderSummary();
            renderCalendar();
        }

        function openAddTabModal() {
            const modal = document.getElementById('add-tab-modal');
            if (modal) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        }
        function closeAddTabModal() {

        function isJapaneseHoliday(year, month, day) {
            const dateStr = `${month}/${day}`;
            const fixedHolidays = ["1/1", "1/2", "1/3", "2/11", "2/23", "4/29", "5/3", "5/4", "5/5", "8/11", "11/3", "11/23"];
            if (fixedHolidays.includes(dateStr)) return true;
            const dayOfWeek = new Date(year, month - 1, day).getDay();
            if (dayOfWeek === 1) {
                if (month === 1 && day >= 8 && day <= 14) return true;
                if (month === 7 && day >= 15 && day <= 21) return true;
                if (month === 9 && day >= 15 && day <= 21) return true;
                if (month === 10 && day >= 8 && day <= 14) return true;
            }
            return false;
        }

        function isHolidayOrWeekend(year, month, day) {
            const date = new Date(year, month - 1, day);
            const dayOfWeek = date.getDay();
            if (dayOfWeek === 0 || dayOfWeek === 6) return true;
            return isJapaneseHoliday(year, month, day);
        }

        function calculatePayday(year, month) {
            if (!salaryConfig || !salaryConfig.day || salaryConfig.day == 0) return null;
            let targetDay = salaryConfig.day;
            const lastDayOfMonth = new Date(year, month, 0).getDate();
            if (targetDay === 99 || targetDay > lastDayOfMonth) targetDay = lastDayOfMonth;
            if (salaryConfig.rule === 'none') return targetDay;

            let curr = new Date(year, month - 1, targetDay);
            if (salaryConfig.rule === 'prev') {
                while (isHolidayOrWeekend(curr.getFullYear(), curr.getMonth() + 1, curr.getDate())) {
                    curr.setDate(curr.getDate() - 1);
                }
            } else if (salaryConfig.rule === 'next') {
                while (isHolidayOrWeekend(curr.getFullYear(), curr.getMonth() + 1, curr.getDate())) {
                    curr.setDate(curr.getDate() + 1);
                }
            }
            if (curr.getMonth() + 1 === month) return curr.getDate();
            return targetDay;
        }

        function getFilteredTransactions() {
            let list = [];
            if (currentTabId === 'all') {

            } else {

            }

            if (salaryConfig.amount && Number(salaryConfig.amount) > 0) {
                const payday = calculatePayday(currentYear, currentMonth);
                if (payday) {
                    const dateStr = `${currentYear}-${String(currentMonth).padStart(2, '0')}-${String(payday).padStart(2, '0')}`;
                    const hasSalaryTx = list.some(t => t.date === dateStr && t.isSalaryAuto);
                    if (!hasSalaryTx) {
                        list.push({
                            id: 'auto_salary',
                            tabId: currentTabId,
                            type: 'income',
                            amount: Number(salaryConfig.amount),
                            date: dateStr,
                            tagName: '給与',
                            memo: '定額自動反映',
                            isSalaryAuto: true
                        });
                    }
                }
            }
            return list;
        }

                if (y === currentYear && m === currentMonth) {

                    else monthlyExpense += t.amount;

                if (t.type === 'income') totalIncome += t.amount;
                else totalExpense += t.amount;

            const netTotal = totalIncome - totalExpense;
            const balEl = document.getElementById('total-balance');
            const incEl = document.getElementById('monthly-income');
            const expEl = document.getElementById('monthly-expense');
            if (balEl) balEl.innerText = `¥${netTotal.toLocaleString()}`;
            if (incEl) incEl.innerText = `¥${monthlyIncome.toLocaleString()}`;
            if (expEl) expEl.innerText = `¥${monthlyExpense.toLocaleString()}`;

                            ${!t.isSalaryAuto ? `
                                <button onclick="deleteTransaction('${t.id}')" class="text-slate-400 hover:text-rose-500 p-1 transition">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            ` : '<span class="text-[10px] text-slate-400 font-bold">自動</span>'}
                        </div>
                    `;
                    listContainer.appendChild(item);
                });
            }

            const modal = document.getElementById('day-detail-modal');
            if (modal) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
            lucide.createIcons();
        }

        function closeDayDetailModal() {
            const modal = document.getElementById('day-detail-modal');
            if (modal) {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }
        }

        function openAddModalFromDetail() {
            openAddModal(selectedDateForModal);
        }

        function deleteTransaction(id) {
            if (!confirm('この明細を削除しますか？')) return;
            transactions = transactions.filter(t => t.id !== id);
            localStorage.setItem('kakeibo_transactions', JSON.stringify(transactions));
            closeDayDetailModal();
            initApp();
        }

        function deletePlan(id) {
            if (!confirm('この予定を削除しますか？')) return;
            plans = plans.filter(p => p.id !== id);
            localStorage.setItem('kakeibo_plans', JSON.stringify(plans));
            closeDayDetailModal();
            initApp();
        }

        initApp();
    </script>
</body>
</html>
