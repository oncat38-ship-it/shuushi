<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Kakeibo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen pb-10">

    <!-- ヘッダー (コンパクト) -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700/60 sticky top-0 z-20">
        <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="bg-indigo-500 text-white p-1.5 rounded-lg">
                    <i data-lucide="wallet" class="w-4 h-4"></i>
                </div>
                <h1 class="text-sm font-bold tracking-wide">My Kakeibo</h1>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-[10px] font-medium px-2 py-0.5 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full">
                    ログイン中
                </span>
                <button class="p-1.5 text-slate-400 hover:text-white hover:bg-slate-700/50 rounded-lg transition">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- タブ切り替え（収支の種類ごと） -->
        <div class="max-w-xl mx-auto px-4 flex space-x-1 overflow-x-auto no-scrollbar border-t border-slate-700/40 py-2">
            <button onclick="switchTab('all')" id="tab-all" class="tab-btn px-3 py-1 text-xs font-semibold rounded-md bg-indigo-600 text-white transition whitespace-nowrap">
                全体・総合
            </button>
            <button onclick="switchTab('personal')" id="tab-personal" class="tab-btn px-3 py-1 text-xs font-semibold rounded-md text-slate-400 hover:text-white hover:bg-slate-700/50 transition whitespace-nowrap">
                プライベート
            </button>
            <button onclick="switchTab('business')" id="tab-business" class="tab-btn px-3 py-1 text-xs font-semibold rounded-md text-slate-400 hover:text-white hover:bg-slate-700/50 transition whitespace-nowrap">
                ビジネス・副業
            </button>
            <button onclick="switchTab('family')" id="tab-family" class="tab-btn px-3 py-1 text-xs font-semibold rounded-md text-slate-400 hover:text-white hover:bg-slate-700/50 transition whitespace-nowrap">
                家計・共有
            </button>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-xl mx-auto px-4 mt-4 space-y-4">

        <!-- 1. 収支表示カード (コンパクト & スマート) -->
        <div class="bg-gradient-to-br from-slate-800 to-slate-800/90 rounded-2xl p-4 border border-slate-700/60 shadow-lg">
            <div class="flex justify-between items-start">
                <div>
                    <span id="current-tab-label" class="text-[11px] font-medium text-indigo-400">全体・総合の総収支</span>
                    <div class="text-2xl sm:text-3xl font-extrabold tracking-tight mt-0.5 text-white">
                        ¥245,800
                    </div>
                </div>
                <button class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-1.5 rounded-xl shadow transition flex items-center space-x-1">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    <span>追加</span>
                </button>
            </div>
            
            <div class="grid grid-cols-2 gap-3 mt-4 pt-3 border-t border-slate-700/60 text-xs">
                <div class="flex items-center space-x-2">
                    <div class="bg-emerald-500/10 p-1.5 rounded-lg text-emerald-400">
                        <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
                    </div>
                    <div>
                        <p class="text-slate-400">今月収入</p>
                        <p class="font-bold text-slate-200">¥320,000</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <div class="bg-rose-500/10 p-1.5 rounded-lg text-rose-400">
                        <i data-lucide="arrow-down-right" class="w-4 h-4"></i>
                    </div>
                    <div>
                        <p class="text-slate-400">今月支出</p>
                        <p class="font-bold text-slate-200">¥74,200</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. カレンダーセクション (主役として大きく配置) -->
        <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700/60 shadow-sm">
            <!-- カレンダーヘッダー -->
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center space-x-2">
                    <i data-lucide="calendar" class="w-4 h-4 text-indigo-400"></i>
                    <h2 class="text-sm font-bold text-white">2026年 10月</h2>
                </div>
                <div class="flex items-center space-x-1">
                    <button class="p-1 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-white transition">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                    </button>
                    <button class="p-1 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-white transition">
                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- 曜日 -->
            <div class="grid grid-cols-7 text-center text-[10px] font-semibold text-slate-400 mb-2">
                <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
            </div>
            
            <!-- 日付グリッド（タッチ可能・詳細確認の土台） -->
            <div class="grid grid-cols-7 gap-1">
                <script>
                    for (let i = 1; i <= 31; i++) {
                        let indicator = '';
                        if (i % 3 === 0) indicator = '<span class="text-[8px] bg-rose-500/20 text-rose-300 px-1 rounded w-full text-center truncate">-¥1.2万</span>';
                        if (i === 25) indicator = '<span class="text-[8px] bg-emerald-500/20 text-emerald-300 px-1 rounded w-full text-center truncate">+¥32万</span>';
                        
                        document.write(`
                            <div onclick="alert('${i}日の明細・詳細を表示します')" class="aspect-[1/1.1] p-1 flex flex-col justify-between items-center rounded-xl bg-slate-700/30 border border-slate-700/50 hover:border-indigo-500 hover:bg-indigo-500/10 cursor-pointer transition">
                                <span class="text-xs text-slate-300 font-medium">${i}</span>
                                <div class="w-full flex flex-col items-center gap-0.5 pb-0.5">
                                    ${indicator}
                                </div>
                            </div>
                        `);
                    }
                </script>
            </div>
        </div>

    </main>

    <!-- スクリプト：タブ切り替えの簡易動作など -->
    <script>
        lucide.createIcons();

        function switchTab(tabId) {
            // タブの見た目切り替え
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-3 py-1 text-xs font-semibold rounded-md text-slate-400 hover:text-white hover:bg-slate-700/50 transition whitespace-nowrap";
            });
            const activeBtn = document.getElementById('tab-' + tabId);
            activeBtn.className = "tab-btn px-3 py-1 text-xs font-semibold rounded-md bg-indigo-600 text-white transition whitespace-nowrap";

            // ラベル変更
            const labels = {
                'all': '全体・総合の総収支',
                'personal': 'プライベートの総収支',
                'business': 'ビジネス・副業の総収支',
                'family': '家計・共有の総収支'
            };
            document.getElementById('current-tab-label').innerText = labels[tabId];
        }
    </script>
</body>
</html>
