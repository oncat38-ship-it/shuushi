<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Kakeibo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body id="app-body" class="antialiased min-h-screen pb-12 transition-colors duration-300 bg-pink-50/60 text-slate-700">

    <!-- ログイン前画面 -->
    <div id="login-overlay" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-2xl text-center space-y-4">
            <div class="w-12 h-12 bg-rose-500 text-white rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-rose-200">
                <i data-lucide="wallet" class="w-6 h-6"></i>
            </div>
            <div>
                <h2 class="text-base font-extrabold text-slate-800">My Kakeibo へようこそ</h2>
                <p class="text-xs text-slate-500 mt-1">Googleアカウントでログインすると、端末間でデータが自動同期されます。</p>
            </div>
            <button onclick="loginWithGoogle()" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-extrabold rounded-2xl text-xs transition shadow-md flex items-center justify-center gap-2">
                <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                Googleでログイン
            </button>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <header class="bg-white/80 backdrop-blur border-b border-pink-100 sticky top-0 z-20 shadow-sm">
        <div class="max-w-xl mx-auto px-4 py-2.5 flex items-center justify-between">
            <h1 class="text-sm font-extrabold text-rose-500 tracking-wide">My Kakeibo 🐾</h1>
            <button onclick="logout()" class="text-xs font-bold text-slate-500 hover:text-rose-500 px-2 py-1 bg-slate-100 rounded-lg">ログアウト</button>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 mt-6 text-center space-y-4">
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-pink-100">
            <h2 class="text-lg font-bold text-slate-800">ログイン成功 🎉</h2>
            <p class="text-xs text-slate-500 mt-1">これでワンタップでスムーズに同期されます。</p>
        </div>
    </main>

    <!-- Firebase SDK (Googleログイン最適化済み) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAoNZm6KwPQuWbC0W65sOh4soLMx1UoUrQ",
          authDomain: "g-account-6f48b.firebaseapp.com",
          projectId: "g-account-6f48b",
          storageBucket: "g-account-6f48b.firebasestorage.app",
          messagingSenderId: "719634797870",
          appId: "1:719634797870:web:60b7483bcc07cdea8d16bf",
          measurementId: "G-9ZPGXN4PWE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        // スマホでログイン状態を消さない設定
        setPersistence(auth, browserLocalPersistence).catch(() => {});

        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.loginWithGoogle = function() {
            signInWithPopup(auth, provider).catch((error) => {
                alert("ログインに失敗しました。SafariやChromeの通常タブでお試しください。");
            });
        };

        window.logout = function() {
            if (confirm('ログアウトしますか？')) {
                signOut(auth).then(() => location.reload());
            }
        };

        onAuthStateChanged(auth, async (user) => {
            const overlay = document.getElementById('login-overlay');
            if (user) {
                if (overlay) overlay.classList.add('hidden');
            } else {
                if (overlay) {
                    overlay.classList.remove('hidden');
                    overlay.classList.add('flex');
                }
            }
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });
    </script>
</body>
</html>
