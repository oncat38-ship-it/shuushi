<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Kakeibo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .theme-cute { font-family: 'M PLUS Rounded 1c', sans-serif; }
        .theme-simple { font-family: 'Noto Sans JP', sans-serif; }
        .theme-classic { font-family: 'Noto Sans JP', serif; }

        /* ★5 予定日用の目立つ自己主張アニメーション */
        @keyframes pulse-attention {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .priority-5-animation {
            animation: pulse-attention 2s infinite ease-in-out;
        }
    </style>
</head>
<body id="app-body" class="antialiased min-h-screen pb-12 transition-colors duration-300">

    <!-- ヘッダー -->
    <header id="app-header" class="backdrop-blur border-b sticky top-0 z-20 shadow-sm transition-colors duration-300">
        <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div id="header-icon-bg" class="p-2 rounded-2xl shadow-md transition-colors duration-300">
                    <i id="header-icon" data-lucide="wallet" class="w-5 h-5 text-white"></i>
                </div>
                <h1 id="header-title" class="text-base font-extrabold tracking-wide flex items-center gap-1">
                    My Kakeibo
                </h1>
            </div>
            <div class="flex items-center space-x-2">
                <span id="save-badge" class="text-[10px] font-bold px-2.5 py-1 border rounded-full flex items-center gap-1">
                    <i data-lucide="sparkles" class="w-3 h-3"></i> 保存中
                </span>
                <button onclick="openSettingsModal()" id="settings-btn" class="p-2 rounded-2xl transition" title="設定">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- タブ切り替えバー -->
        <div id="tabs-bar" class="max-w-xl mx-auto px-4 border-t py-2">
            <div id="tabs-container" class="flex items-center space-x-1.5 overflow-x-auto no-scrollbar"></div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-xl mx-auto px-4 mt-4 space-y-4">

        <!-- 1. 収支表示カード -->
        <div id="summary-card" class="rounded-3xl p-5 text-white shadow-xl relative overflow-hidden transition-all duration-300">
            <div class="flex justify-between items-start relative z-10">
                <div>
                    <span id="current-tab-label" class="text-xs font-bold bg-white/20 backdrop-blur px-2.5 py-1 rounded-full text-white inline-flex items-center gap-1">
                        総合の総収支
                    </span>
                    <div id="total-balance" class="text-3xl sm:text-4xl font-black tracking-tight mt-2 text-white drop-shadow-sm">
                        ¥0
                    </div>
                </div>
                <button onclick="openAddModal()" id="add-tx-btn" class="text-xs font-extrabold px-3.5 py-2 rounded-2xl shadow-md hover:shadow-lg transition flex items-center space-x-1 shrink-0">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    <span>入力する</span>
                </button>
            </div>
            
            <div class="grid grid-cols-2 gap-3 mt-5 pt-3 border-t border-white/30 text-xs relative z-10">
                <div class="flex items-center space-x-2.5 bg-white/15 backdrop-blur p-2.5 rounded-2xl">
                    <div id="income-icon-bg" class="bg-white p-1.5 rounded-xl shadow-sm">
                        <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
                    </div>
                    <div>
                        <p class="opacity-80 text-[10px] font-bold">今月の収入</p>
                        <p id="monthly-income" class="font-black text-sm text-white">¥0</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2.5 bg-white/15 backdrop-blur p-2.5 rounded-2xl">
                    <div id="expense-icon-bg" class="bg-white p-1.5 rounded-xl shadow-sm">
                        <i data-lucide="arrow-down-right" class="w-4 h-4"></i>
                    </div>
                    <div>
                        <p class="opacity-80 text-[10px] font-bold">今月の支出</p>
                        <p id="monthly-expense" class="font-black text-sm text-white">¥0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. カレンダーセクション -->
        <div id="calendar-card" class="rounded-3xl p-3 sm:p-4 border shadow-sm transition-all duration-300">
            <div class="flex items-center justify-between mb-3 px-1">
                <div class="flex items-center space-x-2">
                    <div id="calendar-icon-bg" class="p-1.5 rounded-xl">
                        <i data-lucide="calendar" class="w-4 h-4"></i>
                    </div>
                    <h2 id="calendar-title" class="text-sm font-extrabold"></h2>
                </div>
                <div class="flex items-center space-x-1">
                    <button onclick="changeMonth(-1)" class="p-1.5 rounded-xl border border-transparent hover:border-slate-200 transition">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                    </button>
                    <button onclick="changeMonth(1)" class="p-1.5 rounded-xl border border-transparent hover:border-slate-200 transition">
                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <div id="calendar-weekdays" class="grid grid-cols-7 text-center text-[10px] font-extrabold mb-1">
                <span class="text-rose-500">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="text-sky-500">土</span>
            </div>
            
            <div id="calendar-grid" class="grid grid-cols-7 gap-0.5"></div>
        </div>

    </main>

    <!-- Modal 1: 収支・予定日入力モーダル -->
    <div id="add-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div id="add-modal-content" class="rounded-3xl p-5 max-w-sm w-full shadow-2xl space-y-4 border max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center">
                <h3 id="add-modal-title" class="text-sm font-extrabold">登録する</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:opacity-70"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <div class="space-y-3 text-xs">
                <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-100 rounded-2xl font-bold">
                    <button type="button" id="mode-tx-btn" onclick="setEntryMode('tx')" class="py-1.5 rounded-xl transition">収支を記帳 💸</button>
                    <button type="button" id="mode-plan-btn" onclick="setEntryMode('plan')" class="py-1.5 rounded-xl transition">予定日を設定 📅</button>
                </div>

                <div id="form-tx-section" class="space-y-3">
                    <div>
                        <label class="text-slate-400 font-bold block mb-1">区分</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" id="type-expense-btn" onclick="setTxType('expense')" class="py-2 rounded-2xl font-bold transition">支出 💸</button>
                            <button type="button" id="type-income-btn" onclick="setTxType('income')" class="py-2 rounded-2xl font-bold transition">収入 💰</button>
                        </div>
                    </div>

                    <div>
                        <label class="text-slate-400 font-bold block mb-1">ジャンル（タグ）</label>
                        <div id="tag-select-container" class="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto p-1.5 rounded-2xl border"></div>
                    </div>

                    <div>
                        <label class="text-slate-400 font-bold block mb-1">金額 (円)</label>
                        <input type="number" id="tx-amount" placeholder="例: 1500" class="w-full border rounded-2xl px-3.5 py-2 font-bold focus:outline-none">
                    </div>
                </div>

                <div id="form-plan-section" class="space-y-3 hidden">
                    <div>
                        <label class="text-slate-400 font-bold block mb-1">予定の内容</label>
                        <input type="text" id="plan-title" placeholder="例: 旅行、美容院、支払日など" class="w-full border rounded-2xl px-3.5 py-2 font-bold focus:outline-none">
                    </div>

                    <div>
                        <label class="text-slate-400 font-bold block mb-1">重要度 (★1〜★5)</label>
                        <div class="grid grid-cols-5 gap-1">
                            <button type="button" onclick="setPlanPriority(1)" id="prio-1-btn" class="py-2 rounded-xl font-bold border transition text-center">★1</button>
                            <button type="button" onclick="setPlanPriority(2)" id="prio-2-btn" class="py-2 rounded-xl font-bold border transition text-center">★2</button>
                            <button type="button" onclick="setPlanPriority(3)" id="prio-3-btn" class="py-2 rounded-xl font-bold border transition text-center">★3</button>
                            <button type="button" onclick="setPlanPriority(4)" id="prio-4-btn" class="py-2 rounded-xl font-bold border transition text-center">★4</button>
                            <button type="button" onclick="setPlanPriority(5)" id="prio-5-btn" class="py-2 rounded-xl font-bold border transition text-center">★5</button>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="text-slate-400 font-bold block mb-1">日付</label>
                    <input type="date" id="tx-date" class="w-full border rounded-2xl px-3.5 py-2 font-bold focus:outline-none">
                </div>

                <div>
                    <label class="text-slate-400 font-bold block mb-1">詳細・メモ（任意）</label>
                    <input type="text" id="tx-memo" placeholder="例: メモ書きなど" class="w-full border rounded-2xl px-3.5 py-2 focus:outline-none">
                </div>
            </div>

            <button onclick="saveEntry()" id="save-tx-btn" class="w-full py-3 text-white font-extrabold rounded-2xl text-xs transition shadow-md">保存する</button>
        </div>
    </div>

    <!-- Modal 2: 日別明細モーダル -->
    <div id="day-detail-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div id="day-detail-modal-content" class="rounded-3xl p-5 max-w-sm w-full shadow-2xl space-y-4 border max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center">
                <h3 id="day-detail-title" class="text-sm font-extrabold">日付の明細</h3>
                <button onclick="closeDayDetailModal()" class="text-slate-400 hover:opacity-70"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <div id="day-detail-list" class="space-y-2 max-h-60 overflow-y-auto text-xs"></div>

            <button onclick="openAddModalFromDetail()" id="detail-add-btn" class="w-full py-2.5 font-bold rounded-2xl text-xs transition">
                + この日に追加する
            </button>
        </div>
    </div>

    <!-- Modal 3: タブ追加モーダル -->
    <div id="add-tab-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div id="add-tab-modal-content" class="rounded-3xl p-5 max-w-sm w-full shadow-2xl space-y-4 border">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-extrabold">新しいタブを追加</h3>
                <button onclick="closeAddTabModal()" class="text-slate-400 hover:opacity-70"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <input type="text" id="new-tab-name" placeholder="例: プライベート、副業など" class="w-full border rounded-2xl px-3.5 py-2 text-xs focus:outline-none">
            <button onclick="addNewTab()" id="save-tab-btn" class="w-full py-2.5 text-white font-bold rounded-2xl text-xs transition">追加する</button>
        </div>
    </div>

    <!-- Modal 4: 設定モーダル（2段階ページ移動形式） -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div id="settings-modal-content" class="rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4 border max-h-[85vh] flex flex-col">
            
            <!-- 設定画面ヘッダー -->
            <div class="flex justify-between items-center border-b pb-3 shrink-0">
                <div class="flex items-center space-x-2">
                    <button id="settings-back-btn" onclick="showSettingsMenu()" class="hidden p-1 text-slate-400 hover:text-slate-700 transition">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    </button>
                    <h3 id="settings-header-title" class="text-sm font-extrabold">設定 ⚙️</h3>
                </div>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:opacity-70"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <!-- ページ1: 設定メニュー一覧 -->
            <div id="settings-page-menu" class="space-y-2.5 text-xs overflow-y-auto flex-1 pr-1">
                <button onclick="showSettingsDetail('theme')" class="w-full p-3.5 bg-slate-50/80 hover:bg-slate-100 rounded-2xl border flex items-center justify-between font-bold text-slate-700 transition">
                    <div class="flex items-center space-x-3">
                        <div class="p-2 bg-indigo-100 text-indigo-600 rounded-xl"><i data-lucide="palette" class="w-4 h-4"></i></div>
                        <span>デザインテーマ設定</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
                </button>

                <button onclick="showSettingsDetail('salary')" class="w-full p-3.5 bg-slate-50/80 hover:bg-slate-100 rounded-2xl border flex items-center justify-between font-bold text-slate-700 transition">
                    <div class="flex items-center space-x-3">
                        <div class="p-2 bg-amber-100 text-amber-600 rounded-xl"><i data-lucide="coins" class="w-4 h-4"></i></div>
                        <span>給料日の設定</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
                </button>

                <button onclick="showSettingsDetail('tags')" class="w-full p-3.5 bg-slate-50/80 hover:bg-slate-100 rounded-2xl border flex items-center justify-between font-bold text-slate-700 transition">
                    <div class="flex items-center space-x-3">
                        <div class="p-2 bg-rose-100 text-rose-600 rounded-xl"><i data-lucide="tags" class="w-4 h-4"></i></div>
                        <span>タグの追加・編集</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
                </button>
            </div>

            <!-- ページ2-A: テーマ設定 -->
            <div id="settings-page-theme" class="space-y-4 text-xs overflow-y-auto flex-1 pr-1 hidden">
                <div class="space-y-3">
                    <p class="text-slate-400 font-bold">お好みのデザインテーマを選択してください：</p>
                    <div class="grid grid-cols-1 gap-2.5">
                        <button onclick="setTheme('cute')" id="theme-cute-btn" class="p-3.5 rounded-2xl font-bold border text-left transition flex items-center justify-between">
                            <span>🌸 かわいい系 (パステル＆肉球)</span>
                            <span class="text-xs">🐾</span>
                        </button>
                        <button onclick="setTheme('simple')" id="theme-simple-btn" class="p-3.5 rounded-2xl font-bold border text-left transition flex items-center justify-between">
                            <span>⚪ シンプル (すっきりホワイト)</span>
                            <span class="text-xs">✨</span>
                        </button>
                        <button onclick="setTheme('classic')" id="theme-classic-btn" class="p-3.5 rounded-2xl font-bold border text-left transition flex items-center justify-between">
                            <span>📜 クラシック (温かみのある木目調)</span>
                            <span class="text-xs">🪵</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- ページ2-B: 給料日設定 -->
            <div id="settings-page-salary" class="space-y-4 text-xs overflow-y-auto flex-1 pr-1 hidden">
                <div class="space-y-3">
                    <div>
                        <label class="text-slate-400 font-bold block mb-1">給料日の指定</label>
                        <select id="salary-day-select" class="w-full border rounded-xl px-3 py-2 font-bold focus:outline-none">
                            <option value="0">未設定</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-slate-400 font-bold block mb-1">土日祝日の場合</label>
                        <select id="salary-holiday-rule" class="w-full border rounded-xl px-3 py-2 font-bold focus:outline-none">
                            <option value="prev">前日（前営業日）にずらす</option>
                            <option value="next">翌日（翌営業日）にずらす</option>
                            <option value="none">そのまま（変更なし）</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-slate-400 font-bold block mb-1">金額設定 (任意)</label>
                        <input type="number" id="salary-amount" placeholder="未入力の場合は当日手入力" class="w-full border rounded-xl px-3 py-2 font-bold focus:outline-none">
                    </div>

                    <button onclick="saveSalarySettings()" id="save-salary-btn" class="w-full py-2.5 text-white font-bold rounded-xl transition">保存する</button>
                </div>
            </div>

            <!-- ページ2-C: タグ設定 -->
            <div id="settings-page-tags" class="space-y-4 text-xs overflow-y-auto flex-1 pr-1 hidden">
                <div class="space-y-3">
                    <div>
                        <label class="text-slate-400 font-bold block mb-1">新しいタグを追加</label>
                        <div class="flex space-x-2">
                            <input type="text" id="new-tag-name" placeholder="例: 食費、カフェなど" class="flex-1 border rounded-xl px-3 py-2 focus:outline-none">
                            <button onclick="addNewTag()" id="add-tag-btn" class="px-4 py-2 text-white font-bold rounded-xl transition whitespace-nowrap">追加</button>
                        </div>
                    </div>

                    <div>
                        <label class="text-slate-400 font-bold block mb-1">登録済みタグ一覧</label>
                        <div id="settings-tag-list" class="space-y-1.5 max-h-52 overflow-y-auto p-1 border rounded-2xl"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- アプリケーション制御スクリプト -->
    <script>
        let currentTheme = localStorage.getItem('kakeibo_theme') || 'cute';
        let tabs = JSON.parse(localStorage.getItem('kakeibo_tabs')) || [
            { id: 'all', name: '総合' },
            { id: 'personal', name: 'プライベート' }
        ];
        let currentTabId = tabs[0].id;
        let tags = JSON.parse(localStorage.getItem('kakeibo_tags')) || [];
        let selectedTagId = tags[0] ? tags[0].id : '';
        let salaryConfig = JSON.parse(localStorage.getItem('kakeibo_salary_config')) || {
            day: 25,
            rule: 'prev',
            amount: ''
        };

        let transactions = JSON.parse(localStorage.getItem('kakeibo_transactions')) || [];
        let plans = JSON.parse(localStorage.getItem('kakeibo_plans')) || [];

        let currentEntryMode = 'tx';
        let currentTxType = 'expense';
        let currentPlanPriority = 3;
        let selectedDateForModal = '';

        const now = new Date();
        let currentYear = now.getFullYear();
        let currentMonth = now.getMonth() + 1;

        function initApp() {
            applyTheme(currentTheme);
            renderTabs();
            renderSummary();
            renderCalendar();
            lucide.createIcons();
        }

        function setTheme(theme) {
            currentTheme = theme;
            localStorage.setItem('kakeibo_theme', theme);
            applyTheme(theme);
            renderTabs();
            renderSummary();
            renderCalendar();
        }

        function applyTheme(theme) {
            const body = document.getElementById('app-body');
            body.className = `antialiased min-h-screen pb-12 transition-colors duration-300 theme-${theme}`;

            if (theme === 'cute') {
                body.classList.add('bg-pink-50/60', 'text-slate-700');
                document.getElementById('app-header').className = "bg-white/80 backdrop-blur border-b border-pink-100 sticky top-0 z-20 shadow-sm";
                document.getElementById('header-icon-bg').className = "bg-gradient-to-tr from-pink-400 to-rose-400 text-white p-2 rounded-2xl shadow-pink-200 shadow-md";
                document.getElementById('header-title').className = "text-base font-extrabold text-rose-500 tracking-wide flex items-center gap-1";
                document.getElementById('header-title').innerHTML = 'My Kakeibo <span class="text-xs">🐾</span>';
                document.getElementById('save-badge').className = "text-[10px] font-bold px-2.5 py-1 bg-pink-100/80 text-rose-500 border border-pink-200 rounded-full flex items-center gap-1";
                document.getElementById('settings-btn').className = "p-2 text-rose-400 hover:text-rose-600 hover:bg-pink-100/50 rounded-2xl transition";
                document.getElementById('tabs-bar').className = "max-w-xl mx-auto px-4 border-t border-pink-100/60 py-2";

                document.getElementById('summary-card').className = "bg-gradient-to-br from-rose-400 via-pink-400 to-amber-300 rounded-3xl p-5 text-white shadow-xl shadow-pink-200/60 relative overflow-hidden transition-all duration-300";
                document.getElementById('add-tx-btn').className = "bg-white hover:bg-rose-50 text-rose-500 text-xs font-extrabold px-3.5 py-2 rounded-2xl shadow-md transition flex items-center space-x-1 shrink-0";
                document.getElementById('income-icon-bg').className = "bg-white text-emerald-500 p-1.5 rounded-xl shadow-sm";
                document.getElementById('expense-icon-bg').className = "bg-white text-rose-500 p-1.5 rounded-xl shadow-sm";

                document.getElementById('calendar-card').className = "bg-white rounded-3xl p-3 sm:p-4 border border-pink-100 shadow-sm shadow-pink-100 transition-all duration-300";
                document.getElementById('calendar-icon-bg').className = "p-1.5 bg-pink-100 text-rose-400 rounded-xl";

                document.querySelectorAll('#add-modal-content, #day-detail-modal-content, #add-tab-modal-content, #settings-modal-content').forEach(el => {
                    el.className = "bg-white border border-pink-100 rounded-3xl p-5 sm:p-6 max-w-md w-full shadow-2xl space-y-4 max-h-[85vh] flex flex-col";
                });

                document.getElementById('save-tx-btn').className = "w-full py-3 bg-gradient-to-r from-rose-400 to-pink-400 hover:from-rose-500 hover:to-pink-500 text-white font-extrabold rounded-2xl text-xs transition shadow-md";
                document.getElementById('detail-add-btn').className = "w-full py-2.5 bg-pink-100 hover:bg-pink-200 text-rose-500 font-bold rounded-2xl text-xs transition";
                document.getElementById('save-tab-btn').className = "w-full py-2.5 bg-rose-400 hover:bg-rose-500 text-white font-bold rounded-2xl text-xs transition";
                document.getElementById('save-salary-btn').className = "w-full py-2.5 bg-rose-400 hover:bg-rose-500 text-white font-bold rounded-xl transition";
                document.getElementById('add-tag-btn').className = "px-4 py-2 bg-rose-400 hover:bg-rose-500 text-white font-bold rounded-xl transition whitespace-nowrap";

        function isJapaneseHoliday(year, month, day) {
            const dateStr = `${month}/${day}`;
            const fixedHolidays = ["1/1", "1/2", "1/3", "2/11", "2/23", "4/29", "5/3", "5/4", "5/5", "8/11", "11/3", "11/23"];
            if (fixedHolidays.includes(dateStr)) return true;
            const dayOfWeek = new Date(year, month - 1, day).getDay();
            if (dayOfWeek === 1) {
                if (month === 1 && day >= 8 && day <= 14) return true;
                if (month === 7 && day >= 15 && day <= 21) return true;
                if (month === 9 && day >= 15 && day <= 21) return true;
                if (month === 10 && day >= 8 && day <= 14) return true;
            }
            return false;
        }

        function isHolidayOrWeekend(year, month, day) {
            const date = new Date(year, month - 1, day);
            const dayOfWeek = date.getDay();
            if (dayOfWeek === 0 || dayOfWeek === 6) return true;
            return isJapaneseHoliday(year, month, day);
        }

        function calculatePayday(year, month) {
            if (!salaryConfig || !salaryConfig.day || salaryConfig.day == 0) return null;
            let targetDay = salaryConfig.day;
            const lastDayOfMonth = new Date(year, month, 0).getDate();
            if (targetDay === 99 || targetDay > lastDayOfMonth) targetDay = lastDayOfMonth;
            if (salaryConfig.rule === 'none') return targetDay;

            let curr = new Date(year, month - 1, targetDay);
            if (salaryConfig.rule === 'prev') {
                while (isHolidayOrWeekend(curr.getFullYear(), curr.getMonth() + 1, curr.getDate())) {
                    curr.setDate(curr.getDate() - 1);
                }
            } else if (salaryConfig.rule === 'next') {
                while (isHolidayOrWeekend(curr.getFullYear(), curr.getMonth() + 1, curr.getDate())) {
                    curr.setDate(curr.getDate() + 1);
                }
            }
            if (curr.getMonth() + 1 === month) return curr.getDate();
            return targetDay;
        }

        function getFilteredTransactions() {
            let list = [];
            if (currentTabId === 'all') {
                list = [...transactions];
            } else {
                list = transactions.filter(t => t.tabId === currentTabId);
            }

            if (salaryConfig.amount && Number(salaryConfig.amount) > 0) {
                const payday = calculatePayday(currentYear, currentMonth);
                if (payday) {
                    const dateStr = `${currentYear}-${String(currentMonth).padStart(2, '0')}-${String(payday).padStart(2, '0')}`;
                    const hasSalaryTx = list.some(t => t.date === dateStr && t.isSalaryAuto);
                    if (!hasSalaryTx) {
                        list.push({
                            id: 'auto_salary',
                            tabId: currentTabId,
                            type: 'income',
                            amount: Number(salaryConfig.amount),
                            date: dateStr,
                            tagName: '給料',
                            memo: '定額自動反映',
                            isSalaryAuto: true
                        });
                    }
                }
            }
            return list;
        }

        function renderSummary() {
            const txs = getFilteredTransactions();
            let monthlyIncome = 0;
            let monthlyExpense = 0;
            let totalIncome = 0;
            let totalExpense = 0;

            txs.forEach(t => {
                const [y, m] = t.date.split('-').map(Number);
                if (y === currentYear && m === currentMonth) {
                    if (t.type === 'income') monthlyIncome += t.amount;
                    else monthlyExpense += t.amount;
                }
                if (t.type === 'income') totalIncome += t.amount;
                else totalExpense += t.amount;
            });

            const netTotal = totalIncome - totalExpense;

            document.getElementById('total-balance').innerText = `¥${netTotal.toLocaleString()}`;
            document.getElementById('monthly-income').innerText = `¥${monthlyIncome.toLocaleString()}`;
            document.getElementById('monthly-expense').innerText = `¥${monthlyExpense.toLocaleString()}`;
        }

        // --- カレンダー機能 (重要度★1〜★5に応じた背景変化 ＆ ★5超強調) ---
        function renderCalendar() {
            document.getElementById('calendar-title').innerText = `${currentYear}年 ${currentMonth}月`;
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            const txs = getFilteredTransactions();

            const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const payday = calculatePayday(currentYear, currentMonth);

            const firstDayIndex = new Date(currentYear, currentMonth - 1, 1).getDay();
            const lastDate = new Date(currentYear, currentMonth, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = "min-h-[48px] p-0.5 rounded-xl opacity-10 border border-transparent";
                grid.appendChild(emptyCell);
            }

            for (let i = 1; i <= lastDate; i++) {
                const monthStr = String(currentMonth).padStart(2, '0');
                const dayStr = String(i).padStart(2, '0');
                const dateStr = `${currentYear}-${monthStr}-${dayStr}`;
                const isToday = (dateStr === todayStr);
                const isPayday = (i === payday);

                // 収支データの集計
                const dayTxs = txs.filter(t => t.date === dateStr);
                let dayNetTotal = 0;
                let hasTransaction = dayTxs.length > 0;
                dayTxs.forEach(t => {
                    if (t.type === 'income') dayNetTotal += t.amount;
                    else dayNetTotal -= t.amount;
                });

                // 予定日データの確認
                const dayPlans = plans.filter(p => p.date === dateStr);
                let maxPriority = 0;
                let planInitial = '';
                if (dayPlans.length > 0) {
                    dayPlans.forEach(p => {
                        if (p.priority > maxPriority) {
                            maxPriority = p.priority;
                            planInitial = p.title ? p.title.trim().charAt(0) : '予';
                        }
                    });
                }

                // ★1〜★5 に応じたデザインスタイルの分岐
                let planClass = '';
                if (maxPriority === 5) {
                    // ★5: 絶対見逃さない鮮烈なグラデーション背景 & 光る枠線 & パルス移動
                    planClass = 'bg-gradient-to-br from-rose-400 via-rose-500 to-amber-400 border-rose-600 text-white shadow-md shadow-rose-200 ring-2 ring-rose-400 priority-5-animation z-10';
                } else if (maxPriority === 4) {
                    planClass = 'bg-rose-100/90 border-rose-300 font-bold';
                } else if (maxPriority === 3) {
                    planClass = 'bg-amber-100/80 border-amber-300 font-bold';
                } else if (maxPriority === 2) {
                    planClass = 'bg-purple-50/80 border-purple-200';
                } else if (maxPriority === 1) {
                    planClass = 'bg-blue-50/50 border-blue-200';
                }

                const cell = document.createElement('div');
                cell.className = `min-h-[48px] p-0.5 sm:p-1 flex flex-col justify-between items-center rounded-xl border transition cursor-pointer relative ${
                    isToday 
                        ? 'border-indigo-500 bg-indigo-50/60 shadow-sm' 
                        : isPayday
                        ? 'border-amber-400 bg-amber-50/50'
                        : planClass || 'border-slate-100 hover:border-indigo-300 hover:bg-slate-50/50'
                }`;

                // 予定バッジ（頭文字表示）
                let planBadgeHtml = '';
                if (planInitial) {
                    const badgeBg = maxPriority === 5 ? 'bg-white text-rose-600 font-black shadow-sm' : 'bg-rose-500 text-white font-bold';
                    planBadgeHtml = `<span class="text-[7.5px] ${badgeBg} px-1 rounded-md">${planInitial}</span>`;
                }

                // 収支バッジ
                let badgeHtml = '';
                if (hasTransaction) {
                    const txTextColor = maxPriority === 5 ? 'text-white font-black drop-shadow-sm' : '';
                    if (dayNetTotal > 0) {
                        badgeHtml = `<span class="text-[7.5px] sm:text-[9px] ${maxPriority === 5 ? 'bg-black/20 text-emerald-200' : 'bg-emerald-100 text-emerald-700'} font-extrabold px-0.5 rounded w-full text-center truncate block">+${dayNetTotal.toLocaleString()}</span>`;
                    } else if (dayNetTotal < 0) {
                        badgeHtml = `<span class="text-[7.5px] sm:text-[9px] ${maxPriority === 5 ? 'bg-black/20 text-white' : 'bg-rose-100 text-rose-600'} font-extrabold px-0.5 rounded w-full text-center truncate block">-${Math.abs(dayNetTotal).toLocaleString()}</span>`;
                    } else {
                        badgeHtml = `<span class="text-[7.5px] sm:text-[9px] bg-slate-100 text-slate-600 font-bold px-0.5 rounded w-full text-center truncate block">0</span>`;
                    }
                }

                const dayNumColor = maxPriority === 5 ? 'text-white font-black' : isToday ? 'text-indigo-600' : isPayday ? 'text-amber-600' : 'text-slate-600';

                cell.innerHTML = `
                    <div class="w-full flex justify-between items-center px-0.5">
                        <span class="text-[11px] sm:text-xs font-bold ${dayNumColor}">${i}</span>
                        <div class="flex items-center space-x-0.5">
                            ${planBadgeHtml}
                            ${isPayday ? '<span class="text-[6px] bg-amber-400 text-white px-1 rounded-full font-bold">給料</span>' : isToday ? '<span class="text-[6px] bg-indigo-500 text-white px-1 rounded-full font-bold">今日</span>' : ''}
                        </div>
                    </div>
                    <div class="w-full pb-0.5">
                        ${badgeHtml}
                    </div>
                `;

                cell.onclick = () => openDayDetail(dateStr, i);
                grid.appendChild(cell);
            }
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 12) {
                currentMonth = 1;
                currentYear++;
            } else if (currentMonth < 1) {
                currentMonth = 12;
                currentYear--;
            }
            renderCalendar();
            renderSummary();
        }

        // --- モーダル制御 ---
        function openAddModal(dateStr = '') {
            closeDayDetailModal();
            if (!dateStr) {
                dateStr = `${currentYear}-${String(currentMonth).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            }
            document.getElementById('tx-date').value = dateStr;
            document.getElementById('tx-amount').value = '';
            document.getElementById('tx-memo').value = '';
            document.getElementById('plan-title').value = '';
            
            setEntryMode('tx');
            setTxType('expense');
            setPlanPriority(3);
            renderTagSelector();
            
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('add-modal').classList.add('flex');
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.remove('flex');
            document.getElementById('add-modal').classList.add('hidden');
        }

        function setEntryMode(mode) {
            currentEntryMode = mode;
            const txBtn = document.getElementById('mode-tx-btn');
            const planBtn = document.getElementById('mode-plan-btn');
            const txSection = document.getElementById('form-tx-section');
            const planSection = document.getElementById('form-plan-section');

            if (mode === 'tx') {
                txBtn.className = "py-1.5 rounded-xl transition bg-white text-slate-800 shadow-sm font-bold";
                planBtn.className = "py-1.5 rounded-xl transition text-slate-400 hover:text-slate-700 font-bold";
                txSection.classList.remove('hidden');
                planSection.classList.add('hidden');
                document.getElementById('add-modal-title').innerText = '収支を入力 💸';
            } else {
                txBtn.className = "py-1.5 rounded-xl transition text-slate-400 hover:text-slate-700 font-bold";
                planBtn.className = "py-1.5 rounded-xl transition bg-white text-slate-800 shadow-sm font-bold";
                txSection.classList.add('hidden');
                planSection.classList.remove('hidden');
                document.getElementById('add-modal-title').innerText = '予定日を設定 📅';
            }
        }

        function setTxType(type) {
            currentTxType = type;
            const expBtn = document.getElementById('type-expense-btn');
            const incBtn = document.getElementById('type-income-btn');
            if (type === 'expense') {
                expBtn.className = "py-2 rounded-2xl font-bold bg-rose-500 text-white shadow-sm transition";
                incBtn.className = "py-2 rounded-2xl font-bold bg-slate-100 text-slate-400 transition";
            } else {
                expBtn.className = "py-2 rounded-2xl font-bold bg-slate-100 text-slate-400 transition";
                incBtn.className = "py-2 rounded-2xl font-bold bg-emerald-500 text-white shadow-sm transition";
            }
        }

        function setPlanPriority(prio) {
            currentPlanPriority = prio;
            for (let i = 1; i <= 5; i++) {
                const btn = document.getElementById(`prio-${i}-btn`);
                if (i === prio) {
                    btn.className = "py-2 rounded-xl font-bold border transition text-center bg-amber-400 text-white border-amber-400 shadow-sm";
                } else {
                    btn.className = "py-2 rounded-xl font-bold border transition text-center bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100";
                }
            }
        }

        function saveEntry() {
            const date = document.getElementById('tx-date').value;
            const memo = document.getElementById('tx-memo').value.trim();

            if (!date) {
                alert('日付を選択してください。');
                return;
            }

            if (currentEntryMode === 'tx') {
                const amount = Number(document.getElementById('tx-amount').value);
                if (!amount || amount <= 0) {
                    alert('有効な金額を入力してください。');
                    return;
                }
                const activeTag = tags.find(t => t.id === selectedTagId);
                const tagName = activeTag ? activeTag.name : '未指定';
                const targetTab = currentTabId === 'all' ? (tabs[1] ? tabs[1].id : 'general') : currentTabId;

                const newTx = {
                    id: 'tx_' + Date.now(),
                    tabId: targetTab,
                    tagId: selectedTagId,
                    tagName: tagName,
                    type: currentTxType,
                    amount: amount,
                    date: date,
                    memo: memo
                };
                transactions.push(newTx);
                localStorage.setItem('kakeibo_transactions', JSON.stringify(transactions));
            } else {
                const title = document.getElementById('plan-title').value.trim();
                if (!title) {
                    alert('予定の内容を入力してください。');
                    return;
                }
                const newPlan = {
                    id: 'plan_' + Date.now(),
                    title: title,
                    priority: currentPlanPriority,
                    date: date,
                    memo: memo
                };
                plans.push(newPlan);
                localStorage.setItem('kakeibo_plans', JSON.stringify(plans));
            }

            closeAddModal();
            initApp();
        }

        function openDayDetail(dateStr, dayNum) {
            selectedDateForModal = dateStr;
            const [y, m, d] = dateStr.split('-');
            document.getElementById('day-detail-title').innerText = `${y}年${parseInt(m)}月${parseInt(d)}日の明細・予定`;
            
            const txs = getFilteredTransactions().filter(t => t.date === dateStr);
            const dayPlans = plans.filter(p => p.date === dateStr);

            const listContainer = document.getElementById('day-detail-list');
            listContainer.innerHTML = '';

            if (txs.length === 0 && dayPlans.length === 0) {
                listContainer.innerHTML = '<p class="text-slate-400 text-center py-4">この日のデータはありません</p>';
            } else {
                dayPlans.forEach(p => {
                    const item = document.createElement('div');
                    item.className = "flex justify-between items-center bg-amber-50/80 p-3 rounded-2xl border border-amber-200";
                    item.innerHTML = `
                        <div>
                            <div class="flex items-center space-x-1.5">
                                <span class="text-[10px] bg-amber-400 text-white px-1.5 py-0.5 rounded-md font-extrabold">予定★${p.priority}</span>
                                <p class="font-extrabold text-slate-800">${p.title}</p>
                            </div>
                            ${p.memo ? `<p class="text-[10px] text-slate-500 mt-0.5">${p.memo}</p>` : ''}
                        </div>
                        <button onclick="deletePlan('${p.id}')" class="text-slate-400 hover:text-rose-500 p-1 transition">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    `;
                    listContainer.appendChild(item);
                });

                txs.forEach(t => {
                    const item = document.createElement('div');
                    item.className = "flex justify-between items-center bg-slate-50 p-3 rounded-2xl border border-slate-200/80";
                    const isInc = t.type === 'income';
                    const detailText = t.memo ? `${t.tagName} (${t.memo})` : t.tagName;

                    item.innerHTML = `
                        <div>
                            <p class="font-extrabold text-slate-700">${detailText}</p>
                            <span class="text-[10px] text-slate-400 font-bold">${isInc ? '収入 💰' : '支出 💸'}</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="font-black ${isInc ? 'text-emerald-600' : 'text-rose-600'}">
                                ${isInc ? '+' : '-'}¥${t.amount.toLocaleString()}
                            </span>
                            ${!t.isSalaryAuto ? `
                                <button onclick="deleteTransaction('${t.id}')" class="text-slate-400 hover:text-rose-500 p-1 transition">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            ` : '<span class="text-[10px] text-slate-400 font-bold">自動</span>'}
                        </div>
                    `;
                    listContainer.appendChild(item);
                });
            }

            document.getElementById('day-detail-modal').classList.remove('hidden');
            document.getElementById('day-detail-modal').classList.add('flex');
            lucide.createIcons();
        }

        function closeDayDetailModal() {
            document.getElementById('day-detail-modal').classList.remove('flex');
            document.getElementById('day-detail-modal').classList.add('hidden');
        }

        function openAddModalFromDetail() {
            openAddModal(selectedDateForModal);
        }

        function deleteTransaction(id) {
            if (!confirm('この明細を削除しますか？')) return;
            transactions = transactions.filter(t => t.id !== id);
            localStorage.setItem('kakeibo_transactions', JSON.stringify(transactions));
            closeDayDetailModal();
            initApp();
        }

        function deletePlan(id) {
            if (!confirm('この予定を削除しますか？')) return;
            plans = plans.filter(p => p.id !== id);
            localStorage.setItem('kakeibo_plans', JSON.stringify(plans));
            closeDayDetailModal();
            initApp();
        }

        initApp();
    </script>
</body>
</html>
